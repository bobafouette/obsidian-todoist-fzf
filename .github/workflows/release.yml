name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # Publishing a release from the GitHub web page (which creates the tag too).
  release:
    types: [published]

# Creating a release in the web page can fire both events; run them one at a
# time so the second one only re-uploads the same files.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest.json and versions.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            if (manifest.version !== tag) {
              console.error(`Tag ${tag} does not match manifest.json version ${manifest.version}`);
              process.exit(1);
            }
            if (!Object.prototype.hasOwnProperty.call(versions, tag)) {
              console.error(`versions.json has no entry for ${tag}`);
              process.exit(1);
            }
            console.log(`Tag ${tag} matches manifest.json and versions.json`);
          '

      - name: Repo checks
        run: node scripts/check.js

      - name: Tests
        run: node --test 'test/*.test.js'

      - name: Create the release or attach the files to it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes
          fi
